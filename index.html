<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Telegram Access</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background-color: #ffffff;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      padding: 20px;
      position: relative;
      overflow-x: hidden;
    }

    /* हल्का Telegram-स्टाइल बैकग्राउंड पैटर्न */
    body::before {
      content: "";
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(36, 161, 222, 0.14) 1.2px, transparent 1.2px);
      background-size: 22px 22px;
      pointer-events: none;
      z-index: 0;
    }

    .tg-stack {
      position: relative;
      z-index: 1;
      width: 100%;
      max-width: 390px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .tg-btn {
      width: 100%;
      padding: 15px 18px;
      background: #ffffff;
      border: 1.5px solid #e3eff7;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      box-shadow: 0 4px 16px rgba(36, 161, 222, 0.08);
      transition: transform 0.16s ease, box-shadow 0.16s ease, border-color 0.16s ease, background-color 0.16s ease;
    }

    .tg-btn:hover {
      background-color: #f4faff;
      border-color: #24a1de;
      transform: translateY(-2px);
      box-shadow: 0 8px 22px rgba(36, 161, 222, 0.16);
    }

    .tg-btn:active {
      transform: scale(0.99);
    }

    .tg-left {
      display: flex;
      align-items: center;
      gap: 12px;
      min-width: 0;
    }

    .tg-badge {
      width: 42px;
      height: 42px;
      min-width: 42px;
      border-radius: 50%;
      background: linear-gradient(135deg, #37aee2 0%, #1e96c8 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 3px 10px rgba(36, 161, 222, 0.28);
    }

    .tg-badge svg {
      width: 21px;
      height: 21px;
      fill: #ffffff;
      transform: translateX(-1px);
    }

    .tg-title {
      font-size: 15.5px;
      font-weight: 600;
      color: #17212b;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .tg-action {
      background-color: #eaf6fd;
      color: #1c93d2;
      font-size: 13px;
      font-weight: 700;
      padding: 7px 12px;
      border-radius: 999px;
      white-space: nowrap;
      transition: background-color 0.16s ease, color 0.16s ease;
    }

    .tg-btn:hover .tg-action {
      background-color: #24a1de;
      color: #ffffff;
    }
  </style>
</head>
<body>
  <div class="tg-stack" id="tgButtons"></div>

  <script>
    // यहाँ अपनी 5 Telegram लिंक्स और बटन का नाम डालें
    const telegramLinks = [
      { label: "Join Channel 1", url: "https://t.me/+9xPV4CCFMPozMmU1" },
      { label: "Join Channel 2", url: "https://t.me/+8dDLn_cG-5w4YjBl" },
      { label: "Join Channel 3", url: "https://t.me/+5-SWpKb2OOVjNmNl" },
      { label: "Join Channel 4", url: "https://t.me/+pX9evA7AnbhjZGU9" },
      { label: "Join Channel 5", url: "https://t.me/+gKJh6R7DVko4ZDY1" },

{ label: "Join Channel 6", url: "https://t.me/+828w5jQr6KtmODVl" }
    ];

    const tgIconSvg = `
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M9.78 18.65l.28-4.23 7.68-6.92c.34-.31-.07-.46-.52-.19L7.74 13.3 3.64 12c-.88-.25-.89-.86.2-1.3l16.01-6.16c.73-.3 1.4.18 1.15 1.32l-2.72 12.81c-.19.91-.74 1.13-1.5.71l-4.14-3.05-2 1.92c-.22.22-.41.41-.84.41z"/>
      </svg>
    `;

    const container = document.getElementById("tgButtons");

    telegramLinks.forEach((item) => {
      const button = document.createElement("button");
      button.type = "button";
      button.className = "tg-btn";
      button.innerHTML = `
        <div class="tg-left">
          <div class="tg-badge">${tgIconSvg}</div>
          <span class="tg-title">${item.label}</span>
        </div>
        <span class="tg-action">OPEN</span>
      `;

      button.addEventListener("click", () => {
        if (!item.url || item.url.includes("your_channel_")) {
          alert("कृपया कोड में अपनी 5 असली Telegram लिंक डालें।");
          return;
        }
        window.open(item.url, "_blank", "noopener,noreferrer");
      });

      container.appendChild(button);
    });
  </script>
</body>
</html>
